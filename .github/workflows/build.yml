name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install build tools
        run: |
          command -v xcodegen || brew install xcodegen
          command -v ffmpeg || brew install ffmpeg
      - name: Generate embedded test videos
        shell: bash
        run: |
          set -euo pipefail
          for spec in 360p:640x360 480p:854x480 720p:1280x720 4x3:640x480 21x9:1260x540; do
            name="${spec%%:*}"
            size="${spec#*:}"
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=${size}:rate=24" -t 12 -an -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p -movflags +faststart "VTPlayer/test-${name}.mp4"
          done
      - name: Cache generated animation excerpts
        id: animation-cache
        uses: actions/cache@v4
        with:
          path: |
            VTPlayer/morevna-*.mp4
            VTPlayer/hero-*.mp4
            VTPlayer/pepper-*.mp4
          key: animation-excerpts-v1
      - name: Download and prepare animation excerpts
        if: steps.animation-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          prepare() {
            local name="$1" url="$2" start="$3"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 300 \
              --user-agent 'VTPlayerLab/0.1 (https://github.com/pingpingjinping/ios-video-player; public animation samples)' \
              "$url" --output "$work/$name.webm"
            for spec in 360p:640:360 480p:854:480 720p:1280:720; do
              IFS=: read -r tier w h <<< "$spec"
              ffmpeg -hide_banner -loglevel error -y -ss "$start" -i "$work/$name.webm" -t 15 -map 0:v:0 -an \
                -vf "scale=$w:$h:force_original_aspect_ratio=decrease:force_divisible_by=2:flags=lanczos:out_color_matrix=bt709:out_range=tv,setsar=1,fps=24" \
                -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p \
                -color_range tv -colorspace bt709 -color_primaries bt709 -color_trc bt709 -movflags +faststart \
                "VTPlayer/$name-$tier.mp4"
              ffprobe -v error -show_entries stream=width,height,r_frame_rate -of compact "VTPlayer/$name-$tier.mp4"
            done
          }
          prepare morevna 'https://upload.wikimedia.org/wikipedia/commons/a/a7/Morevna_Episode_3.0.2_%28English%29.webm' 60
          prepare hero 'https://upload.wikimedia.org/wikipedia/commons/a/a9/HERO_-_Blender_Open_Movie-full_movie.webm' 45
          prepare pepper 'https://upload.wikimedia.org/wikipedia/commons/8/8d/Morevna_Project_-_Pepper%26Carrot_%28animated_comic%29_-_Episode_6_-_The_Potion_Contest_%28Russian_variant%29.webm' 75
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iPhone
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project VTPlayer.xcodeproj -scheme VTPlayer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build.log
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VTPlayer.app Payload/
          for name in 360p 480p 720p 4x3 21x9; do test -s "Payload/VTPlayer.app/test-${name}.mp4"; done
          for collection in morevna hero pepper; do
            for tier in 360p 480p 720p; do test -s "Payload/VTPlayer.app/$collection-$tier.mp4"; done
          done
          /usr/bin/zip -qry VTPlayer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VTPlayer-IPA
          path: VTPlayer.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
